org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# org.gradle.java.home pinned a macOS Android Studio path, which made the build
# fail on any other machine ("Java home supplied is invalid"). Let the JDK come
# from JAVA_HOME / the IDE instead of hardcoding it per developer.
# org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
android.useAndroidX=true
kotlin.code.style=official
